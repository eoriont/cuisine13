version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cuisine13_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./priv/repo/docker_init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: dev
    environment:
      MIX_ENV: dev
      DATABASE_URL: postgres://postgres:postgres@db:5432/cuisine13_dev
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development_secret_key_base_please_change_in_production}
      PHX_HOST: localhost
      PHX_SERVER: "true"
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
      - node_modules:/app/assets/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "mix ecto.create && mix ecto.migrate && mix phx.server"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  mix_deps:
  mix_build:
  node_modules:
